[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "mriforge"
dynamic = ["version"]
description = "A multi-paradigm research framework for MRI reconstruction, super-resolution, and generative modelling"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Adnane Gdihi", email = "adnane.gdihi@gmail.com" },
]
keywords = [
  "mri", "magnetic-resonance-imaging", "image-reconstruction",
  "generative-models", "diffusion-models", "physics-informed",
  "deep-learning", "pytorch",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Typing :: Typed",
]
dependencies = [
  "torch>=2.11",
  "numpy>=2.0",
  "pydantic>=2.13",
  "pydantic-settings>=2.14",
  "pillow>=12",
  "pyyaml>=6",
  "h5py>=3.16",
  "tqdm>=4.67",
  "scipy>=1.17",
  "pandas>=2.3",
  "openpyxl>=3.1",
  "jaxtyping>=0.3",
  "rich>=15",
  "typer>=0.25",
  "einops>=0.8",
  # Memory telemetry — imported unconditionally by
  # infrastructure/services/memory_optimization_service.py, which bootstrap.py
  # loads for EVERY training command (train/sanity/ablation/campaign). Was an
  # undeclared hard import that crashed on any env without psutil incidentally
  # present (cluster .pip, 2026-05-29). Core, not optional.
  "psutil>=7.2",
  # Perceptual / distribution validation metrics — LPIPS/FID/KID/MS-SSIM/UQI in
  # core/metrics/evaluation_metrics.py, imported at module top-level. Undeclared
  # until the 2026-07-01 review: when the import failed the module silently
  # returned a fabricated 0.0 for these, pegging any `primary_metric: lpips`
  # arm's plateau monitor at a constant (now raises instead — pitfall #9).
  # NOTE: torchmetrics requires huggingface-hub<1.0 to import; if your env has
  # hf-hub>=1.0 the import fails and these metrics raise. Resolve at the env
  # level (we do not pin hf-hub here to avoid cascading transformers downgrades).
  # See docs/review_fixes_2026_07_01.rst.
  "torchmetrics>=1.9,<2.0",
  # Same story as psutil above. Declared ONLY under `viz` until 2026-08-12, but
  # imported at module top level — not deferred into a function — by three
  # modules that `populate_model_registry()` loads eagerly:
  #   models/losses/perceptual_loss.py      `from torchvision import models`
  #   models/losses/gan_loss_library.py     `from torchvision import models`
  #   infrastructure/training/strategies/diffusion.py
  #                                         `from torchvision.utils import save_image`
  # CLAUDE.md makes that populate call mandatory and load-bearing, so a core
  # install could not build its own registry. Invisible because `.[dev]` pulls
  # `.[all]`, which includes `viz` — every developer and CI env had it
  # incidentally. 16 other sites defer the import correctly; these three do not,
  # and they are loss/strategy code rather than plotting. Core, not optional.
  #
  # Pinned to the same index as torch in [tool.uv.sources]: the two ship
  # compiled ops against a fixed torch ABI, and a mismatched pair raises
  # `RuntimeError: operator torchvision::nms does not exist` on any import that
  # reaches torchvision.ops — which is populate_model_registry(). Observed
  # 2026-08-12 with torch 2.13.0+cpu against a PyPI torchvision.
  "torchvision>=0.26",
]

[project.optional-dependencies]
mri = [
  "torchio>=1.2",
  "monai>=1.5",
  "nibabel>=5.4",
  "torchkbnufft>=1.5",
]
# Pretrained Stable-Diffusion VAE backbone for the latent diffusion generator
# (model_kwargs.vae_backbone: sd → mriforge.models.generators.pretrained_vae_adapter).
# Guarded at runtime: absent diffusers, PretrainedSDVAEAdapter raises a clean
# ImportError at construction (CLAUDE.md #9 — no silent fallback to a random
# latent). Pure-Python, so it rides in the one-shot `.[all]` resolve.
# (einops moved to core.)
diffusion = ["diffusers>=0.30"]
viz = [
  "matplotlib>=3.10",
  "tensorboard>=2.16",
  "seaborn>=0.13",
  "scikit-learn>=1.8",
  # torchvision moved to core dependencies — it is a hard import on the
  # registry-populate path, not a plotting extra. See the note there.
  # Optional: interactive group-IQM plots in the MRIQC-style HTML report
  # (mriforge.infrastructure.reporting.html_report). Absent → static-PNG
  # fallback, so this is a soft dependency, not a hard requirement.
  "plotly>=6.8",
]
hpo = ["optuna>=4.8"]
# Mamba / SSM models (hilbert_mamba, geomamba, d2_mamba, bloch_mamba, …) REQUIRE
# the official selective-scan CUDA kernel — MambaBlock fails loud without it
# (the Gated-Conv+GRU fallback is NOT an SSM and is opt-in via
# MRIFORGE_ALLOW_MAMBA_FALLBACK for CPU/CI wiring tests only). Needs CUDA + nvcc
# to build, so it is a separate extra (not in core deps / CPU installs):
#     pip install -e '.[mamba]' --no-build-isolation
mamba = [
  "mamba-ssm>=2.2",
  "causal-conv1d>=1.4",
]
# 8-bit optimizer states (Dettmers et al.), reachable as
# optimizer_type: adam8bit / adamw8bit. Registered unconditionally and RAISING
# at construction when absent -- never a silent fall back to a 32-bit optimizer,
# because the 8-bit state IS the arm's memory claim and substituting one would
# make its memory/convergence numbers describe a different run.
# Deliberately NOT in `all`: the wheel ships a CUDA binary whose import fails on
# the CPU boxes CI runs on (same reasoning as `mamba`, different mechanism).
#     pip install -e '.[bnb]'
bnb = ["bitsandbytes>=0.45"]
# Schedule-free optimizers (Defazio et al. 2024), as schedulefree_adamw /
# schedulefree_sgd. Same raise-not-fallback guard. Pure Python and resolvable in
# one shot, so unlike `bnb` it rides in `all`.
schedulefree = ["schedulefree>=1.4"]
# ZeRO / DeepCompile / ZenFlow backend, reachable as parallel.strategy: deepspeed.
# `check_deepspeed_extra_installed` (an ERROR-severity audit check) hands this
# exact install line to the user, and DeepSpeedUnavailableError repeats it, so
# the extra has to exist -- pip on a missing extra warns and installs NOTHING,
# which reads as "the fix did not help" on a fresh cluster node.
# Deliberately NOT in `all`, for the `mamba`/`bnb` reason: DeepSpeed JIT-builds
# CUDA ops and needs nvcc, so it cannot resolve on CI's CPU boxes.
#     pip install -e '.[deepspeed]'
deepspeed = ["deepspeed>=0.15"]
# Closed-form perceptual IQA metrics (HaarPSI, MDSI, VSI, DSS, MS-GMSD) used by
# the sim2rank metric sweep. Guarded at runtime — absent piq, those metrics are
# skipped, like the radiomic metrics under a missing pyradiomics.
iqa = ["piq>=0.8"]
# Learned perceptual similarity (lpips_alex metric). Guarded at runtime —
# absent lpips the metric raises a clean ImportError at construction.
#     pip install -e '.[eval]'
eval = ["lpips>=0.1.4"]
# No-reference metric battery deps (TODO/NR_METRICS_IMPLEMENTATION_SPEC.md §9).
# PyWavelets powers the wavelet texture metrics (wlms/wpde); scikit-learn +
# statsmodels back the aggregator / ICC / group-lasso. Guarded at runtime —
# absent pywt the wavelet metrics raise a clean ImportError at construction and
# ``get_metric`` skips them (the frd/pyradiomics precedent).
quality = [
  "PyWavelets>=1.9",
  "scikit-learn>=1.8",
  "statsmodels>=0.14",
]
# Persistent-homology / optimal-transport topology losses (cubical_ph_w2, the
# geomamba_ulf PH arms). gudhi builds the cubical complex + persistence diagram;
# POT provides the Wasserstein matching. Guarded at construction —
# CubicalPHWassersteinLoss raises ImportError without them and the geomamba
# strategy re-raises RuntimeError rather than silently degrading to L1
# (pitfalls #9/#16). Installed via `make install-topology`.
topology = [
  "gudhi>=3.12",
  "POT>=0.9",
]
docs = [
  "sphinx>=9.1",
    "sphinx-rtd-theme>=3",
  "furo>=2024.5",
  "sphinx-autoapi>=3.1",
  "myst-parser>=5",
  "sphinxcontrib-mermaid>=2",
  "sphinx-copybutton>=0.5",
]
test = [
  "pytest>=9",
  "pytest-cov>=7",
  "pytest-xdist>=3.5",
  # 16 test files carry `@pytest.mark.timeout(...)`, but nothing registered the marker and
  # nothing enforced it: the decorators were inert (#16) and, under `--strict-markers`,
  # tests/smoke/ failed to COLLECT. Declaring the marker by hand would have silenced the
  # error while leaving the timeouts dead. The plugin registers it AND honours it.
  "pytest-timeout>=2.3",
  "hypothesis>=6.152",
]
# Profiling toolchain for `mriforge profile` (docs/SCALENE_USAGE.md). Scalene was
# used and documented here for a long time while being declared NOWHERE — a
# working `.venv` and a green docs page together made an undeclared dependency
# look installed, so a fresh clone had a documented command it could not run.
# `mriforge profile` raises an actionable error when scalene is absent rather
# than degrading to another profiler, so this extra is what makes it reachable.
profile = [
  "scalene>=1.5",
]
dev = [
  # dev == the full `all` feature set + lint/type/hook tooling. Referencing
  # `all` (not a hand-listed subset) keeps the two meta-groups from drifting —
  # the previous hand-list silently omitted hpo/eval/topology, so a "full dev"
  # box was missing those features.
  "mriforge[all]",
  "pre-commit>=4.6",
  "ruff>=0.15",
  "mypy>=2.1",
  # The config-migration toolchain (#976). 12 scripts under scripts/ and tools/
  # import it, including `scripts/ci/migrate_config_keys.py`, which
  # `check_no_legacy_config_keys.py` execs at startup — so on a fresh clone the
  # rename-promotion gate died on ModuleNotFoundError and the drain it owns
  # could not be run at all, leaving hand-editing `_DRAINED` (which its own
  # docstring forbids) as the only route. NOT interchangeable with pyyaml: it is
  # here for round-trip preservation, and the experiment corpus carries
  # load-bearing comments that a pyyaml rewrite would silently strip.
  # Tooling only — nothing under `src/` imports it, so it stays out of the
  # runtime extras.
  "ruamel.yaml>=0.18",
]
# "Install everything" convenience group: every runtime + tooling extra that
# resolves in a SINGLE `pip install` (build isolation ON). This is the set a
# cluster install should pull so no feature silently degrades at run time —
# LPIPS/piq metrics (iqa/eval), topology losses (topology), HPO (hpo), docs, and
# the pytest smoke battery (test).
#
# NB: the `mamba` extra is DELIBERATELY EXCLUDED. mamba-ssm / causal-conv1d
# compile the CUDA selective-scan kernel, which requires `--no-build-isolation`
# with torch ALREADY installed (their setup imports torch) plus a full CUDA
# toolchain (nvcc). They therefore cannot ride in a one-shot `.[all]` resolve —
# pip's isolated build env has no torch. On a cluster node with nvcc, install
# them as a documented SECOND step, after `.[all]` has brought torch in:
#     pip install -e '.[all]'
#     pip install -e '.[mamba]' --no-build-isolation
all = ["mriforge[mri,diffusion,viz,hpo,docs,test,iqa,eval,quality,topology,schedulefree,profile]"]

[project.scripts]
mriforge = "mriforge.cli.app:main"

# Out-of-tree plugin discovery contract (see mriforge.plugins / docs/plugins.rst).
# A third-party package declares its custom components in ITS OWN pyproject under
# these groups; mriforge imports them at registry population so the @register_*
# decorators fire. Models/losses/metrics map name -> "module[:attr]" (imported as
# a side effect); strategies map short-name -> "module.StrategyClass" (resolved
# lazily by the strategy factory). These framework-side stubs are intentionally
# empty — the framework registers its own components in-tree.
[project.entry-points."mriforge.models"]

[project.entry-points."mriforge.losses"]

[project.entry-points."mriforge.metrics"]

[project.entry-points."mriforge.strategies"]

[project.urls]
Homepage = "https://github.com/adnaneGdihi/mriforge"
Documentation = "https://mriforge.readthedocs.io"
Repository = "https://github.com/adnaneGdihi/mriforge"
Issues = "https://github.com/adnaneGdihi/mriforge/issues"
Changelog = "https://github.com/adnaneGdihi/mriforge/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/mriforge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mriforge"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/databases",
  "/experiments/archive",
  "/experiments/.backup_*",
  "/audit",
  "/.github",
  "/docs/_build",
  "/.venv",
  "/.claude",
  "/tests_experiments",
  "/scratch",
  "/conductor",
  "/runners",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "C4", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"experiments/**" = ["E", "F", "N"]
# Measurement harnesses under docs/analysis/ render matplotlib figures, where
# MULTIPLICATION SIGN and MINUS SIGN are the typographically correct glyphs in
# an axis label -- RUF001 wants ASCII lookalikes that would render as "32x".
# Narrow on purpose: only the ambiguous-character rule, only these scripts.
"docs/analysis/**" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src/mriforge/core", "src/mriforge/config", "src/mriforge/domain"]

[[tool.mypy.overrides]]
module = ["torch.*", "monai.*", "torchio.*", "torchkbnufft.*", "h5py.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "unit: fast unit tests (default)",
  "physics: physics-correctness tests (default)",
  "smoke: pre-launch smoke tests (default)",
  "integration: integration tests (opt-in)",
  "e2e: end-to-end tests (opt-in)",
  "gpu: requires CUDA (skipped in CI)",
  "slow: tests taking >10s (opt-in)",
  "sanity_shape: parametrized shape/dtype support-contract test",
  "adjoint: operator adjoint identity (dot-product test)",
  "gradcheck: torch.autograd.gradcheck-based (fp64)",
  "metamorphic: metamorphic relation (equivariance/monotonicity)",
  "property: hypothesis-driven property test",
  "fuzz: stochastic input generation; nondeterministic by design",
  "differential: cross-implementation diff (needs reference lib)",
  "registry_contract: parametric over a registry",
  "architecture: AST-level fitness function",
  # Red BY DESIGN until the recorded debt is paid down, so these carry
  # xfail(strict=False) as well -- a permanently-failing test in the default lane
  # trains readers to ignore the suite (#629). Select with `-m debt_tracker` to
  # read the paydown report; the companion *_has_no_stale_entries gates stay hard.
  "debt_tracker: reports remaining recorded architecture debt (xfail until empty)",
  "determinism: bit-exact reproducibility",
  "audit_regression: audit-ladder positive/negative corpus",
  "convergence: short end-to-end training run",
  "performance: step-time / memory / sync-barrier benchmarks (gpu-only)",
  # `benchmark` is a plain label, not the pytest-benchmark fixture (that plugin is
  # not a dependency): test_dict_pooling_benchmark.py hand-rolls its own timing.
  # The precommit/pr/nightly Makefile lanes already deselect it, but the mark was
  # never registered, so under --strict-markers the file failed to COLLECT and took
  # the whole session down with it.
  "benchmark: timing / allocation comparison; deselected outside the release lane",
  "data_integrity: train/val/test leakage guard (patient, augmentation, normalization)",
  "requires_sigpy: needs SigPy installed",
  "requires_bart: needs BART CLI on PATH",
]
filterwarnings = [
  "error::DeprecationWarning:mriforge.*",
  "ignore::DeprecationWarning:torchkbnufft.*",
  "ignore::DeprecationWarning:torch.*",
  # `torch.ao.quantization`'s deprecation is issued with a stacklevel that
  # attributes it to the CALLER, so the module-keyed `torch.*` ignore above
  # never sees it -- it arrives labelled `mriforge.*` and hits the `error` rule
  # on the first line. Keyed on the message instead, which is the only field
  # that identifies it. This is torch's own deprecation of an API that remains
  # supported until 2.10; the torchao migration is tracked separately, and the
  # `mriforge.*` error rule is deliberately left untouched.
  "ignore:torch.ao.quantization is deprecated:DeprecationWarning",
  "ignore::DeprecationWarning:torchio.*",
  "ignore::DeprecationWarning:monai.*",
]

[tool.coverage.run]
source = ["src/mriforge"]
branch = true
omit = ["*/tests/*", "*/experiments/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
fail_under = 60   # composite floor; per-layer thresholds enforced in CI
show_missing = true

# ============================================================
# uv-specific configuration — preserved from previous layout so the
# CUDA 12.9 PyTorch wheels keep resolving when `uv` is the resolver.
# `pip install` uses PyPI by default; users on CUDA install torch
# explicitly from the PyTorch index per README instructions.
# ============================================================

[tool.uv]
environments = [
    "sys_platform == 'linux'",
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu129" }]
# torchvision ships compiled ops built against a FIXED torch ABI, so it must
# resolve from the same index as torch. Pinning only torch let the pair diverge:
# `torch 2.13.0+cpu` with a PyPI `torchvision 0.28.0` raises
# `RuntimeError: operator torchvision::nms does not exist` on any import that
# reaches `torchvision.ops` — which includes `populate_model_registry()`.
torchvision = [{ index = "pytorch-cu129" }]

[tool.uv.extra-build-dependencies]
antlr4-python3-runtime = ["setuptools"]
