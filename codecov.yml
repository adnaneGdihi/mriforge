# Codecov configuration. Gates PR merges on the coverage delta documented
# in CONTRIBUTING.md ("Coverage must not regress more than 1 percentage
# point"). Codecov picks this file up automatically when `coverage.xml`
# is uploaded by the `test.yml` workflow.

coverage:
  precision: 2
  round: down
  range: "70...95"

  status:
    project:
      default:
        target: auto              # compare against base branch
        threshold: 1%             # allow up to 1pp drop before failing
        if_no_uploads: error
        if_not_found: success
        only_pulls: false
    patch:
      default:
        target: 80%               # new code in the diff must hit 80% covered
        threshold: 5%
        only_pulls: true

# Components break coverage out by subsystem so PRs can see which area
# regressed. The components below mirror docs/how_to/ci_and_release.md.
component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 1%
  individual_components:
    - component_id: physics
      name: Physics (SSOT)
      paths:
        - src/mriforge/infrastructure/physics/**
    - component_id: models
      name: Models
      paths:
        - src/mriforge/models/**
    - component_id: training
      name: Training strategies
      paths:
        - src/mriforge/infrastructure/training/**
    - component_id: data
      name: Data pipeline
      paths:
        - src/mriforge/data/**
    - component_id: config
      name: Config schemas
      paths:
        - src/mriforge/config/**

comment:
  layout: "header, diff, components, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

ignore:
  - "tests/**"
  - "experiments/**"
  - "docs/**"
  - "scripts/**"
  - "scratch/**"
  - "**/__init__.py"
  - "**/conftest.py"
  - "src/mriforge/exports/**"   # autogenerated
