# Read the Docs build for https://spectramr.readthedocs.io
#
# `fail_on_warning: true` is deliberate and it passes. Measured 2026-09-04 against
# a fresh clone of the PUBLIC tree -- which is what RTD builds -- with the mock set
# RTD's thin environment produces (every heavy dep a `pip install .[docs]` does NOT
# provide forced into `autodoc_mock_imports`): `sphinx-build -W` exited 0 with zero
# sphinx warnings and 84 pages. Do not measure this in the private checkout: it
# carries docs/api/ (174 generated rst files, not in public_allowlist.txt and never
# shipped), whose re-documented members raise 527 unsuppressable "duplicate object
# description" warnings. Sphinx emits those with no `type=`, so `suppress_warnings`
# in docs/conf.py cannot reach them -- they read as a blocker and are not one here.
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    # Install the CPU torch wheel BEFORE the project, or `pip install .[docs]`
    # resolves `torch>=2.8` from PyPI and drags in the whole nvidia-*-cu13 stack,
    # cuda-toolkit and triton -- 5.1 GB measured, none of it used to render a page,
    # and enough to exhaust the build's time and disk budget. docs/conf.py mocks
    # what it cannot import, so the docs do not need a GPU build; they do need
    # torch importable, because autodoc imports the package.
    pre_install:
      - pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
