# zizmor configuration — workflow static-analysis tuning.
#
# Every `uses:` in this tree is a full-length commit SHA, so the eleven
# `ref-shape: any` allowances that used to live here are gone rather than
# narrowed. They existed to concede a backlog ("Pinning every action to a SHA
# hash is a separate hardening pass"); that pass has happened, and a standing
# allowance for a shape the tree no longer contains is a hole nobody would
# notice being used again.
#
# Dependabot keeps the pins fresh — `.github/dependabot.yml` covers the
# `github-actions` ecosystem weekly, and reads the `# vX.Y.Z` comment beside
# each SHA. That comment is what makes a pinned ref reviewable, so it is not
# decoration: it names the release the SHA is, and it always names the ref the
# workflow originally declared rather than some other tag that happens to point
# at the same commit.
#
# Scanned at `.github/`, NOT `.github/workflows/`. Composite actions live in
# `.github/actions/`, and `setup-env/action.yml` is referenced by 20 job steps
# across both trees — a workflow-only scan root never saw the one file with the
# widest blast radius in the directory.

rules:
  unpinned-uses:
    config:
      policies:
        # One policy, no exceptions. A new action arrives pinned or zizmor
        # rejects it; there is no "trusted publisher" tier to be added to,
        # because that tier is exactly how the previous eleven accumulated.
        "*": "hash-pin"
