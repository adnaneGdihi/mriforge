name: CodeQL

on:
  # No `branches:` filter -- it matches the PR's BASE branch, and PRs here target
  # BOTH `dev` (the working branch) and `main` (dependabot and publish PRs).
  # Pinning it to either base silently skips the other. See pr-required.yml.
  #
  # Pull requests only: no `schedule:`. CI in this repo is PR-triggered by policy
  # (docs/contributing/ci.rst, "Every trigger is a pull request").
  pull_request:

permissions:
  actions: read
  contents: read
  security-events: write

# Advisory while the repo is private — see docs/explanation/ci_ratchet.md.
# CodeQL on private repos requires GitHub Advanced Security; without it the
# analysis runs but cannot upload SARIF (the upload step is what fails).
# Once the repo flips to public or GHAS is licensed, drop continue-on-error.
jobs:
  analyze:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
