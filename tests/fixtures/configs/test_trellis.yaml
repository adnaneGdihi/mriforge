augmentation:
  enabled: false
checkpoint:
  enabled: true
  save_interval: 10
config_version: '5.0'
data:
  batch_size: 2
  dataset_type: synthetic
  num_workers: 0
  patch_size:
  - 32
  - 32
  - 32
logging:
  log_dir: ./tests/output/trellis
  log_interval: 1
loss:
  reconstruction:
    loss_type: l1
loss_logging:
  enabled: true
  frequency: 10
metadata:
  name: test_trellis
  tags:
    type: e2e_test
metrics:
  enabled: true
model:
  in_channels: 1
  model_kwargs:
    features:
    - 32
    - 64
  model_type: vae
  out_channels: 1
  spatial_dims: 3
optimization:
  learning_rate: 0.0001
  optimizer_type: adamw
  use_amp: false
task: reconstruction
training:
  device: cpu
  epochs: 1
  strategy_class: src.infrastructure.training.strategies.volumetric.TRELLISTrainingStrategy
  task: reconstruction
  training_mode: trellis
training_mode: trellis
objectives:
  reconstruction:
    lambda_l1: 1.0
trellis:
  enabled: true
validation:
  enabled: true
  eval_interval: 2

workflow:
  regime: mri_structural
  task: reconstruction
