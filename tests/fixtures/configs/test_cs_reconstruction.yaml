augmentation:
  enabled: false
checkpoint:
  enabled: true
  save_interval: 10
config_version: '5.0'
data:
  batch_size: 2
  dataset_type: synthetic
  num_workers: 0
  patch_size:
  - 64
  - 64
  - 1
logging:
  log_dir: ./tests/output/cs_reconstruction
  log_interval: 1
loss:
  reconstruction:
    loss_type: l1
loss_logging:
  enabled: true
  frequency: 10
metadata:
  name: test_cs_reconstruction
  tags:
    type: e2e_test
metrics:
  enabled: true
model:
  in_channels: 2
  model_kwargs:
    features:
    - 32
    - 64
  model_type: unet
  out_channels: 2
  spatial_dims: 2
optimization:
  learning_rate: 0.0001
  optimizer_type: adamw
  use_amp: false
physics:
  compressed_sensing:
    acceleration_factor: 4.0
    enabled: true
  data_consistency:
    enabled: true
    weight: 1.0
task: reconstruction
training:
  device: cpu
  epochs: 1
  max_iterations: 2
  strategy_class: src.infrastructure.training.strategies.cs_reconstruction_strategy.CompressedSensingReconstructionStrategy
  task: reconstruction
  training_mode: reconstruction
training_mode: reconstruction
objectives:
  reconstruction:
    lambda_l1: 1.0
validation:
  enabled: true
  eval_interval: 2

workflow:
  regime: mri_structural
  task: reconstruction
