augmentation:
  enabled: false
checkpoint:
  enabled: true
  save_interval: 10
config_version: '5.0'
data:
  batch_size: 2
  dataset_type: synthetic
  num_workers: 0
  patch_size:
  - 64
  - 64
  - 1
logging:
  log_dir: ./tests/output/graph_cold_diffusion
  log_interval: 1
loss:
  reconstruction:
    loss_type: l1
loss_logging:
  enabled: true
  frequency: 10
metadata:
  name: test_graph_cold_diffusion
  tags:
    type: e2e_test
metrics:
  enabled: true
model:
  in_channels: 2
  model_kwargs:
    features:
    - 32
    - 64
  model_type: kspace_cold_diffusion
  out_channels: 2
  spatial_dims: 2
objectives:
  reconstruction:
    lambda_graph_consistency: 0.1
optimization:
  learning_rate: 0.0001
  optimizer_type: adamw
  use_amp: false
task: reconstruction
training:
  device: cpu
  epochs: 1
  max_iterations: 2
  strategy_class: src.infrastructure.training.strategies.graph_cold_diffusion_strategy.GraphColdDiffusionStrategy
  task: reconstruction
  training_mode: cold_diffusion
training_mode: cold_diffusion
validation:
  enabled: true
  eval_interval: 2

workflow:
  regime: mri_structural
  task: reconstruction
