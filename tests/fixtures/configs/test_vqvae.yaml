augmentation:
  enabled: false
checkpoint:
  enabled: true
  save_interval: 10
config_version: '5.0'
data:
  batch_size: 2
  dataset_type: synthetic
  num_workers: 0
  patch_size:
  - 64
  - 64
  - 1
logging:
  log_dir: ./tests/output/vqvae
  log_interval: 1
loss:
  latent:
    latent_loss_type: vq
loss_logging:
  enabled: true
  frequency: 10
metadata:
  name: test_vqvae
  tags:
    type: e2e_test
metrics:
  enabled: true
model:
  in_channels: 1
  model_kwargs:
    latent_dim: 4
    num_embeddings: 100
  model_type: vqvae
  out_channels: 1
  spatial_dims: 2
  z_dim: 4
objectives:
  latent:
    lambda_commit: 0.25
    lambda_vq: 1.0
optimization:
  learning_rate: 0.0001
  optimizer_type: adamw
  use_amp: false
task: reconstruction
training:
  device: cpu
  epochs: 1
  max_iterations: 2
  strategy_class: src.infrastructure.training.strategies.vae.VQVAETrainingStrategy
  task: reconstruction
  training_mode: vqvae
training_mode: vqvae
validation:
  enabled: true
  eval_interval: 2

workflow:
  regime: mri_structural
  task: reconstruction
