augmentation:
  enabled: false
checkpoint:
  enabled: true
  save_interval: 10
config_version: '5.0'
data:
  batch_size: 2
  dataset_type: synthetic
  num_workers: 0
  patch_size:
  - 64
  - 64
  - 1
logging:
  log_dir: ./tests/output/domain_adaptation
  log_interval: 1
loss:
  domain_adaptation:
    lambda_adversarial: 0.1
loss_logging:
  enabled: true
  frequency: 10
metadata:
  name: test_domain_adaptation
  tags:
    type: e2e_test
metrics:
  enabled: true
model:
  in_channels: 1
  model_kwargs:
    features:
    - 32
    - 64
  model_type: unet
  out_channels: 1
  spatial_dims: 2
  discriminator_component:
    model_type: patchgan
    in_channels: 1
    out_channels: 1
objectives:
  domain_adaptation:
    lambda_adversarial: 0.1
    num_domains: 2
optimization:
  learning_rate: 0.0001
  optimizer_type: adamw
  use_amp: false
  discriminator:
    enabled: true
    learning_rate: 0.0001
task: reconstruction
training:
  device: cpu
  epochs: 1
  max_iterations: 2
  strategy_class: src.infrastructure.training.strategies.domain_adaptation.DomainAdaptationTrainingStrategy
  task: reconstruction
  training_mode: domain_adaptation
training_mode: domain_adaptation
validation:
  enabled: true
  eval_interval: 2

workflow:
  regime: mri_structural
  task: reconstruction
