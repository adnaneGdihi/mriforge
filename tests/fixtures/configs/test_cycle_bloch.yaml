augmentation:
  enabled: false
checkpoint:
  enabled: true
  save_interval: 10
config_version: '5.0'
data:
  batch_size: 2
  dataset_type: synthetic
  num_workers: 0
  patch_size:
  - 64
  - 64
  - 1
logging:
  log_dir: ./tests/output/cycle_bloch
  log_interval: 1
loss:
  biophysical_flow:
    lambda_bloch: 0.1
  reconstruction:
    loss_type: l1
loss_logging:
  enabled: true
  frequency: 10
metadata:
  name: test_cycle_bloch
  tags:
    type: e2e_test
metrics:
  enabled: true
model:
  in_channels: 1
  model_kwargs:
    features:
    - 32
    - 64
  model_type: unet
  out_channels: 1
  spatial_dims: 2
  discriminator_component:
    model_type: patchgan
    in_channels: 1
    out_channels: 1
optimization:
  learning_rate: 0.0001
  optimizer_type: adamw
  use_amp: false
  discriminator:
    enabled: true
    optimizer_type: adamw
    learning_rate: 0.0001
physics:
  bloch_simulation:
    enabled: true
    target_te: 100.0
    target_tr: 3000.0
task: reconstruction
training:
  device: cpu
  epochs: 1
  max_iterations: 2
  strategy_class: src.infrastructure.training.strategies.cycle_bloch_strategy.CycleBlochStrategy
  task: reconstruction
  training_mode: reconstruction
training_mode: reconstruction
objectives:
  l1: 1.0
  strategy_class: src.infrastructure.training.strategies.cycle_bloch_strategy.CycleBlochStrategy
  task: reconstruction
  training_mode: reconstruction
validation:
  enabled: true
  eval_interval: 2

workflow:
  regime: mri_structural
  task: reconstruction
