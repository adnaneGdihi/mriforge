# Minimal Reconstruction Config for Testing
# Used by: tests/unit/, tests/smoke/

config_version: "5.0"

data:
  batch_size: 2

model:
  model_type: variational_network
  in_channels: 1
  out_channels: 1

training:
  training_mode: reconstruction

optimization:
  learning_rate: 0.0001

logging:
  log_interval: 10
  level: warning

losses:
  

checkpoint: {}

max_iterations: 100

workflow:
  regime: mri_structural
  task: reconstruction
run:
  seed: 42
