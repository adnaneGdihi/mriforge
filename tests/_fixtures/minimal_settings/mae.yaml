# UNVERIFIED: validate via mriforge audit on cluster
# Minimal settings fixture for the mae/ssl family.
# Covers strategy keys: mae, ssl
# Both keys resolve to MAEPretrainingStrategy (STRATEGY_CLASS_PATHS).
# Based on experiments/validated/dummy_mae.yaml (trimmed to minimal fields).
config_version: '1.0'

run:
  seed: 42
metadata:
  name: minimal_mae_fixture
  description: Minimal CPU smoke fixture for MAEPretrainingStrategy (mae + ssl)
  tags:
    - fixture
    - minimal
    - mae
    - ssl
    - pretraining

training:
  strategy_class: mriforge.infrastructure.training.strategies.pretraining.MAEPretrainingStrategy
  epochs: 1
  max_iterations: 2
  device: cpu
  task: pretraining
  output_dir: /tmp/mriforge_test/mae

data:
  coil_processing_mode: rss
  dataset_type: synthetic
  patch_size: [16, 16, 1]
  batch_size: 2
  num_workers: 0
  normalize_kspace: false
  normalize_images: true
  validation_split: 0.1
  target_channels: 1
  samples_per_volume: 2
  datasets:
    - name: synthetic
      path: /tmp/synthetic_placeholder
  caching:
    strategy: none

model:
  model_type: mae
  in_channels: 1
  out_channels: 1
  model_kwargs:
    patch_size: 8
    embed_dim: 64
    encoder_depth: 2
    decoder_depth: 2
    num_heads: 2
    mlp_ratio: 2.0
    mask_ratio: 0.75

optimization:
  learning_rate: 1.0e-4
  optimizer_type: adamw
  weight_decay: 0.0001
  beta1: 0.9
  beta2: 0.999
  use_amp: false
  enable_gradient_clipping: false

acceleration:
  base_acceleration: 4.0

losses:
  output_domain: image
  image_losses:
    - name: mse
      weight: 1.0
      enabled: true
  kspace_losses: []
  complex_losses: []

physics:
  kspace:
    enforce_hermitian_symmetry: false
    enable_kspace_recon: false
  data_consistency:
    enabled: false

logging:
  log_interval: 1
  log_to_file: false
  log_to_console: false
  enable_experiment_tracking: false
  level: warning

checkpoint:
  enabled: false

validation:
  enabled: false

metrics:
  compute_psnr: false
  compute_ssim: false
  compute_mse: true
