# Canonical passing YAML for reconstruction paradigm.
# Based on experiments/active/dummy_basic.yaml (known-good active config).
# Used by: tests/audit/test_audit_regression.py corpus/passing sweep.

config_version: '1.0'

run:
  seed: 42
metadata:
  name: Corpus Passing — Reconstruction Basic
  description: Minimal reconstruction config for audit regression corpus
  tags:
    - corpus
    - reconstruction

training:
  strategy_class: mriforge.infrastructure.training.strategies.reconstruction.ReconstructionTrainingStrategy
  epochs: 1
  max_iterations: 10
  device: cuda
  task: reconstruction
  output_dir: experiments/results/corpus_reconstruction_basic

data:
  coil_processing_mode: rss
  dataset_type: synthetic
  patch_size:
    - 32
    - 32
    - 1
  batch_size: 4
  num_workers: 0
  normalize_kspace: false
  normalize_images: true
  validation_split: 0.1
  target_channels: 1
  samples_per_volume: 2
  datasets:
    - name: dummy
      path: databases/m4raw/data/multicoil_train
  caching:
    strategy: none

model:
  model_type: standard_unet
  in_channels: 1
  out_channels: 1
  model_kwargs:
    base_channels: 32
    channel_multipliers:
      - 1
      - 2
    num_res_blocks: 1
    dropout: 0.0

optimization:
  learning_rate: 0.0001
  optimizer_type: adam
  weight_decay: 0.0
  beta1: 0.9
  beta2: 0.999
  use_amp: false
  enable_gradient_clipping: true
  gradient_clip_method: norm
  gradient_clip_value: 1.0
  scheduler:
    type: cosine_annealing
    T_max: 10
    eta_min: 0.000001
    warm_up_epochs: 0

logging:
  log_interval: 5
  log_to_file: false
  log_to_console: true
  enable_experiment_tracking: false
  level: warning
  log_dir: experiments/results/corpus_reconstruction_basic/logs
  enable_tensorboard: false

losses:
  output_domain: image
  image_losses:
    - name: mse
      weight: 1.0
      enabled: true
  kspace_losses: []
  complex_losses: []

metrics:
  compute_psnr: true
  compute_ssim: true
  compute_mse: true
  metric_interval: 5

validation:
  enabled: true
  eval_interval: 5

physics:
  kspace:
    enforce_hermitian_symmetry: false
    enable_kspace_recon: false
  data_consistency:
    enabled: false

checkpoint:
  enabled: false
