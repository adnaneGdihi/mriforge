config_version: '1.0'

run:
  seed: 42
metadata:
  name: Failing — required_section (data absent)

training:
  strategy_class: spectramr.infrastructure.training.strategies.reconstruction.ReconstructionTrainingStrategy
  epochs: 1
  device: cuda
  task: reconstruction
  output_dir: experiments/results/corpus_failing_required_section

# data: section intentionally omitted — violation

model:
  model_type: standard_unet
  in_channels: 1
  out_channels: 1

optimization:
  learning_rate: 0.0001
  optimizer_type: adam

logging:
  log_interval: 5
  level: warning
  log_dir: experiments/results/corpus_failing_required_section/logs

losses:
  output_domain: image
  image_losses:
    - name: mse
      weight: 1.0
      enabled: true
  kspace_losses: []
  complex_losses: []
