# FAILING YAML — trips: num_workers_valid (ValidatorRegistry)
# Violation: data.num_workers = -1 (must be >= 0)
# check_name: num_workers_valid

# expect: tier0 data.loader.num_workers
#   Tier 0 rejects this before the health checker runs -- the schema
#   constraint IS the named violation, which is a stronger result than
#   the Tier-1 check firing, not a weaker one.

config_version: '1.0'

run:
  seed: 42
metadata:
  name: Failing — num_workers_valid (negative num_workers)

training:
  strategy_class: mriforge.infrastructure.training.strategies.reconstruction.ReconstructionTrainingStrategy
  max_iterations: 10
  device: cuda
  task: reconstruction
  output_dir: experiments/results/corpus_failing_num_workers

data:
  coil_processing_mode: rss
  dataset_type: synthetic
  patch_size: [32, 32, 1]
  batch_size: 4
  num_workers: -1   # <<< VIOLATION: must be >= 0
  datasets:
    - name: dummy
      path: databases/m4raw/data/multicoil_train

model:
  model_type: standard_unet
  in_channels: 1
  out_channels: 1

optimization:
  learning_rate: 0.0001
  optimizer_type: adam

logging:
  log_interval: 5
  level: warning
  log_dir: experiments/results/corpus_failing_num_workers/logs

losses:
  output_domain: image
  image_losses:
    - name: mse
      weight: 1.0
      enabled: true
  kspace_losses: []
  complex_losses: []
