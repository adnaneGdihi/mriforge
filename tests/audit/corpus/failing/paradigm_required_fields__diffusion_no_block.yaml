# FAILING YAML — trips: paradigm_required_fields (ConfigHealthChecker)
# Violation: strategy_class contains "diffusion" but training.diffusion
#   block is absent. The check fires because "diffusion" appears in
#   marker = (strategy_class + training_mode).lower() and the required
#   path ("training", "diffusion") resolves to None.
# check_name: paradigm_required_fields
# severity: error

config_version: '1.0'

run:
  seed: 42
metadata:
  name: Failing — paradigm_required_fields (diffusion strategy, no training.diffusion block)

training:
  strategy_class: spectramr.infrastructure.training.strategies.diffusion.DiffusionTrainingStrategy
  epochs: 1
  max_iterations: 10
  device: cuda
  task: diffusion
  output_dir: experiments/results/corpus_failing_paradigm_diffusion
  # training.diffusion block is ABSENT — violation for diffusion paradigm

data:
  coil_processing_mode: rss
  dataset_type: synthetic
  patch_size: [32, 32, 1]
  batch_size: 2
  num_workers: 0
  datasets:
    - name: dummy
      path: databases/m4raw/data/multicoil_train

model:
  model_type: standard_unet
  in_channels: 1
  out_channels: 1

optimization:
  learning_rate: 0.0002
  optimizer_type: adamw

logging:
  log_interval: 5
  level: warning
  log_dir: experiments/results/corpus_failing_paradigm_diffusion/logs

losses:
  output_domain: image
  image_losses:
    - name: mse
      weight: 1.0
      enabled: true
  kspace_losses: []
  complex_losses: []
