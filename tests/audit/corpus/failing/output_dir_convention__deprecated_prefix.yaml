# FAILING YAML — trips: output_dir_convention (ConfigHealthChecker)
# Violation: training.output_dir starts with the deprecated prefix
# 'experiments/active/' — the check fires with severity="error" for any
# output_dir under one of the _OUTPUT_DIR_DEPRECATED_PREFIXES set.
# check_name: output_dir_convention

config_version: '1.0'

run:
  seed: 42
metadata:
  name: Failing — output_dir_convention (deprecated active/ prefix)

training:
  strategy_class: mriforge.infrastructure.training.strategies.reconstruction.ReconstructionTrainingStrategy
  epochs: 1
  device: cuda
  task: reconstruction
  output_dir: experiments/active/my_experiment_results  # VIOLATION: deprecated prefix

data:
  coil_processing_mode: rss
  dataset_type: synthetic
  patch_size: [32, 32, 1]
  batch_size: 4
  num_workers: 0
  normalize_images: true
  validation_split: 0.1
  target_channels: 1
  samples_per_volume: 2
  datasets:
    - name: dummy
      path: databases/m4raw/data/multicoil_train
  caching:
    strategy: none

model:
  model_type: standard_unet
  in_channels: 1
  out_channels: 1
  model_kwargs:
    base_channels: 32
    channel_multipliers: [1, 2]
    num_res_blocks: 1
    dropout: 0.0

optimization:
  learning_rate: 0.0001
  optimizer_type: adam
  weight_decay: 0.0
  use_amp: false
  enable_gradient_clipping: false

logging:
  log_interval: 5
  level: warning
  log_dir: experiments/results/corpus_failing_output_dir_convention/logs

losses:
  output_domain: image
  image_losses:
    - name: mse
      weight: 1.0
      enabled: true
  kspace_losses: []
  complex_losses: []

physics:
  kspace:
    enforce_hermitian_symmetry: false
    enable_kspace_recon: false
  data_consistency:
    enabled: false
