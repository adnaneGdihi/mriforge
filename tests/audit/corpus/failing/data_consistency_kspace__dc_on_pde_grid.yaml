# FAILING YAML — trips: data_consistency_kspace (ConfigHealthChecker)
# Violation: physics.data_consistency.enabled=true but data.dataset_type='pde_synthetic'
#   which resolves to domain='pde_grid'.  DC layers need k-space (or image-domain)
#   data to project against measurements; 'pde_grid' is not a valid domain.
# check_name: data_consistency_kspace
# severity: error
#
# How the check fires (config_health_checker.py::check_data_consistency_requires_kspace):
#   physics.data_consistency.enabled = True
#   data_form['domain_inferred'] = 'pde_grid'  (pde_synthetic → pde_grid)
#   'pde_grid' not in {'kspace', 'complex_image', 'image'}  → error

config_version: '1.0'

run:
  seed: 42
metadata:
  name: Failing — data_consistency_kspace (DC enabled on pde_synthetic dataset)

training:
  strategy_class: spectramr.infrastructure.training.strategies.reconstruction.ReconstructionTrainingStrategy
  training_mode: reconstruction
  max_iterations: 10
  device: cuda
  task: reconstruction
  output_dir: experiments/results/corpus_failing_dc_kspace

data:
  dataset_type: pde_synthetic   # <<< pde_grid domain — not compatible with DC
  coil_processing_mode: none
  patch_size: [32, 32, 1]
  batch_size: 2
  num_workers: 0
  pde_problem: burgers_1d
  datasets:
    - name: dummy
      path: databases/m4raw/data/multicoil_train

  sampling:
    num_synthetic_samples: 100
model:
  model_type: standard_unet
  in_channels: 1
  out_channels: 1

optimization:
  learning_rate: 0.0001
  optimizer_type: adam

logging:
  log_interval: 5
  level: warning
  log_dir: experiments/results/corpus_failing_dc_kspace/logs

losses:
  output_domain: image
  image_losses:
    - name: mse
      weight: 1.0
      enabled: true
  kspace_losses: []
  complex_losses: []

physics:
  data_consistency:
    enabled: true   # <<< VIOLATION: DC requires k-space or image data, not pde_grid
