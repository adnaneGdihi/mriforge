# FAILING YAML — trips: acceleration_consistency (ConfigHealthChecker)
# Violation: base_acceleration (8.0) > max_acceleration (4.0) — empty
#   acceleration schedule range.
# check_name: acceleration_consistency
# severity: error

config_version: '1.0'

run:
  seed: 42
metadata:
  name: Failing — acceleration_consistency (base > max)

training:
  strategy_class: spectramr.infrastructure.training.strategies.reconstruction.ReconstructionTrainingStrategy
  max_iterations: 10
  device: cuda
  task: reconstruction
  output_dir: experiments/results/corpus_failing_accel_consistency

data:
  coil_processing_mode: rss
  dataset_type: synthetic
  patch_size: [32, 32, 1]
  batch_size: 4
  num_workers: 0
  datasets:
    - name: dummy
      path: databases/m4raw/data/multicoil_train

model:
  model_type: standard_unet
  in_channels: 1
  out_channels: 1

optimization:
  learning_rate: 0.0001
  optimizer_type: adam

acceleration:
  base_acceleration: 8.0    # <<< VIOLATION: base > max
  max_acceleration: 4.0     # max < base → empty range
  center_fraction: 0.08

logging:
  log_interval: 5
  level: warning
  log_dir: experiments/results/corpus_failing_accel_consistency/logs

losses:
  output_domain: image
  image_losses:
    - name: mse
      weight: 1.0
      enabled: true
  kspace_losses: []
  complex_losses: []
