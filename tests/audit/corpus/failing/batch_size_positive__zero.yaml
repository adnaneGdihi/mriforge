# FAILING YAML — trips: batch_size_positive (ValidatorRegistry)
# Violation: data.batch_size = 0 (must be > 0)
# check_name: batch_size_positive (registered in validator_registry.py)

# expect: tier0 data.loader.batch_size
#   Tier 0 rejects this before the health checker runs -- the schema
#   constraint IS the named violation, which is a stronger result than
#   the Tier-1 check firing, not a weaker one.

config_version: '1.0'

run:
  seed: 42
metadata:
  name: Failing — batch_size_positive (zero)

training:
  strategy_class: spectramr.infrastructure.training.strategies.reconstruction.ReconstructionTrainingStrategy
  max_iterations: 10
  device: cuda
  task: reconstruction
  output_dir: experiments/results/corpus_failing_batch_size

data:
  coil_processing_mode: rss
  dataset_type: synthetic
  patch_size: [32, 32, 1]
  batch_size: 0   # <<< VIOLATION: must be > 0
  num_workers: 0
  datasets:
    - name: dummy
      path: databases/m4raw/data/multicoil_train

model:
  model_type: standard_unet
  in_channels: 1
  out_channels: 1

optimization:
  learning_rate: 0.0001
  optimizer_type: adam

logging:
  log_interval: 5
  level: warning
  log_dir: experiments/results/corpus_failing_batch_size/logs

losses:
  output_domain: image
  image_losses:
    - name: mse
      weight: 1.0
      enabled: true
  kspace_losses: []
  complex_losses: []
