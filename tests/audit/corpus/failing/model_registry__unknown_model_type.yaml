# FAILING YAML — trips: model_registry (ConfigHealthChecker)
# Violation: model.model_type is set to a name that does not exist in the
# ModelFactory registry. The health checker fires model_registry with
# severity="error" when model_type is not None but is absent from the
# registry dict.
# check_name: model_registry

# expect: tier0 model_type
#   Tier 0 rejects this before the health checker runs -- the schema
#   constraint IS the named violation, which is a stronger result than
#   the Tier-1 check firing, not a weaker one.

config_version: '1.0'

run:
  seed: 42
metadata:
  name: Failing — model_registry (unknown model_type)

training:
  strategy_class: spectramr.infrastructure.training.strategies.reconstruction.ReconstructionTrainingStrategy
  epochs: 1
  device: cuda
  task: reconstruction
  output_dir: experiments/results/corpus_failing_model_registry

data:
  coil_processing_mode: rss
  dataset_type: synthetic
  patch_size: [32, 32, 1]
  batch_size: 4
  num_workers: 0
  datasets:
    - name: dummy
      path: databases/m4raw/data/multicoil_train
  caching:
    strategy: none

model:
  model_type: totally_nonexistent_model_xyzzy_999
  in_channels: 1
  out_channels: 1

optimization:
  learning_rate: 0.0001
  optimizer_type: adam

logging:
  log_interval: 5
  level: warning
  log_dir: experiments/results/corpus_failing_model_registry/logs

losses:
  output_domain: image
  image_losses:
    - name: mse
      weight: 1.0
      enabled: true
  kspace_losses: []
  complex_losses: []
