# FAILING YAML — trips: amp_grad_clip_interaction (ConfigHealthChecker)
# Violation: use_amp=true + enable_gradient_clipping=true but
#   gradient_clip_value is null → unscale_() called twice pattern.
# check_name: amp_grad_clip_interaction
# severity: warning (the check emits warning, not error)

config_version: '1.0'

run:
  seed: 42
metadata:
  name: Failing — amp_grad_clip_interaction (null clip value)

training:
  strategy_class: mriforge.infrastructure.training.strategies.reconstruction.ReconstructionTrainingStrategy
  max_iterations: 10
  device: cuda
  task: reconstruction
  output_dir: experiments/results/corpus_failing_amp_clip

data:
  coil_processing_mode: rss
  dataset_type: synthetic
  patch_size: [32, 32, 1]
  batch_size: 4
  num_workers: 0
  datasets:
    - name: dummy
      path: databases/m4raw/data/multicoil_train

model:
  model_type: standard_unet
  in_channels: 1
  out_channels: 1

optimization:
  learning_rate: 0.0001
  optimizer_type: adam
  use_amp: true                   # AMP enabled
  enable_gradient_clipping: true  # clipping also enabled
  gradient_clip_value: null       # <<< VIOLATION: null clip value with AMP+clipping

logging:
  log_interval: 5
  level: warning
  log_dir: experiments/results/corpus_failing_amp_clip/logs

losses:
  output_domain: image
  image_losses:
    - name: mse
      weight: 1.0
      enabled: true
  kspace_losses: []
  complex_losses: []
