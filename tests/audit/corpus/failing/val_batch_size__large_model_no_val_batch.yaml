# FAILING YAML — trips: val_batch_size (ConfigHealthChecker)
# Violation: large model (sum(features) > 1024) but validation.val_batch_size
#   is not explicitly set.  check_val_batch_size fires a warning.
# check_name: val_batch_size
# severity: warning
#
# How the check fires (config_health_checker.py::check_val_batch_size):
#   validation.val_batch_size is None                 → not explicitly set
#   model_kwargs.features = [64, 128, 256, 512, 512]  → sum = 1472 > 1024 → warning

config_version: '1.0'

run:
  seed: 42
metadata:
  name: Failing — val_batch_size (large model, no explicit val_batch_size)

training:
  strategy_class: mriforge.infrastructure.training.strategies.reconstruction.ReconstructionTrainingStrategy
  training_mode: reconstruction
  max_iterations: 10
  device: cuda
  task: reconstruction
  output_dir: experiments/results/corpus_failing_val_batch_size

data:
  dataset_type: synthetic
  coil_processing_mode: rss
  patch_size: [64, 64, 1]
  batch_size: 2
  num_workers: 0
  datasets:
    - name: dummy
      path: databases/m4raw/data/multicoil_train

model:
  model_type: standard_unet
  in_channels: 1
  out_channels: 1
  model_kwargs:
    features: [64, 128, 256, 512, 512]  # <<< sum = 1472 > 1024 → large model heuristic

validation:
  enabled: true
  # validation.loader.batch_size is intentionally ABSENT — that is the violation.
  # The block itself must stay non-empty: a `validation:` key carrying only a
  # comment parses as null, and check_val_batch_size early-returns passed=True on
  # a null section, so the fixture would silently stop testing anything.

optimization:
  learning_rate: 0.0001
  optimizer_type: adam

logging:
  log_interval: 5
  level: warning
  log_dir: experiments/results/corpus_failing_val_batch_size/logs

losses:
  output_domain: image
  image_losses:
    - name: mse
      weight: 1.0
      enabled: true
  kspace_losses: []
  complex_losses: []
