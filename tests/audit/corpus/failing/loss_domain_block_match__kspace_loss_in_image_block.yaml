# FAILING YAML — trips: loss_domain_block_match (ConfigHealthChecker)
# Violation: a loss registered with domain='kspace' (e.g. 'kspace_l1') is placed
#   under losses.image_losses.  LossRegistry._loss_domains metadata for 'kspace_l1'
#   declares domain='kspace'; expected_domain for image_losses is 'image'.
#   check_loss_domain_block_match fires because declared != expected_domain
#   and 'image' is not in compatible_with.
# check_name: loss_domain_block_match
# severity: error
#
# How the check fires (config_health_checker.py::check_loss_domain_block_match):
#   block_attr = 'image_losses',  expected_domain = 'image'
#   entry.name = 'kspace_l1'
#   meta = LossRegistry._loss_domains.get('kspace_l1')
#   meta['domain'] = 'kspace'  ≠ 'image'  and 'image' not in compatible_with → error
#
# NOTE: This check fires only when 'kspace_l1' is registered WITH domain metadata
# in LossRegistry._loss_domains.  If the registry doesn't populate _loss_domains
# for kspace_l1 (older losses without domain metadata), the entry is soft-skipped.

config_version: '1.0'

run:
  seed: 42
metadata:
  name: Failing — loss_domain_block_match (kspace_l1 under image_losses)

training:
  strategy_class: mriforge.infrastructure.training.strategies.reconstruction.ReconstructionTrainingStrategy
  training_mode: reconstruction
  max_iterations: 10
  device: cuda
  task: reconstruction
  output_dir: experiments/results/corpus_failing_loss_domain_block_match

data:
  dataset_type: synthetic
  coil_processing_mode: rss
  patch_size: [32, 32, 1]
  batch_size: 2
  num_workers: 0
  datasets:
    - name: dummy
      path: databases/m4raw/data/multicoil_train

model:
  model_type: standard_unet
  in_channels: 1
  out_channels: 1

optimization:
  learning_rate: 0.0001
  optimizer_type: adam

logging:
  log_interval: 5
  level: warning
  log_dir: experiments/results/corpus_failing_loss_domain_block_match/logs

losses:
  output_domain: image
  image_losses:
    - name: kspace_l1        # <<< VIOLATION: kspace-domain loss under image_losses block
      weight: 0.5
      enabled: true
    - name: mse
      weight: 1.0
      enabled: true
  kspace_losses: []
  complex_losses: []
