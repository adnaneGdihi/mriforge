# FAILING YAML — trips: adversarial_strategy_requires_gan_loss (ConfigHealthChecker)
# Violation: training.training_mode='gan' resolves to AdversarialMixin-based strategy
#   but losses.gan block is absent.  AdversarialMixin.__init__ raises
#   ValueError("AdversarialMixin requires `config.losses.gan` to be set").
# check_name: adversarial_strategy_requires_gan_loss
# severity: error
#
# How the check fires (config_health_checker.py::check_adversarial_strategy_requires_gan_loss):
#   training.training_mode = 'gan'
#   'gan' in _ADVERSARIAL_TRAINING_MODES                  → True
#   losses.gan is None                                    → error

config_version: '1.0'

run:
  seed: 42
metadata:
  name: Failing — adversarial_strategy_requires_gan_loss (gan mode, no losses.gan)

training:
  strategy_class: spectramr.infrastructure.training.strategies.gan.GANTrainingStrategy
  training_mode: gan            # <<< adversarial mode — losses.gan required
  max_iterations: 10
  device: cuda
  task: reconstruction
  output_dir: experiments/results/corpus_failing_adv_gan_loss

data:
  dataset_type: synthetic
  coil_processing_mode: rss
  patch_size: [32, 32, 1]
  batch_size: 2
  num_workers: 0
  datasets:
    - name: dummy
      path: databases/m4raw/data/multicoil_train

model:
  model_type: standard_unet
  in_channels: 1
  out_channels: 1

optimization:
  learning_rate: 0.0001
  optimizer_type: adam

logging:
  log_interval: 5
  level: warning
  log_dir: experiments/results/corpus_failing_adv_gan_loss/logs

losses:
  output_domain: image
  image_losses:
    - name: mse
      weight: 1.0
      enabled: true
  kspace_losses: []
  complex_losses: []
  # losses.gan is intentionally ABSENT — this is the violation
  # AdversarialMixin requires losses.gan to be populated for gan/disentangled/guided_sr modes
