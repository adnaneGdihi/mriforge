# FAILING YAML — trips: hardcoded_cluster_paths (ConfigHealthChecker)
# Violation: data.index_path starts with the forbidden cluster prefix
# '/project/johnsson/' — a hardcoded absolute path that embeds another
# user's account directory and will break portability.
# The check fires with severity="error" unless MRIFORGE_DATA_ROOT or
# PROJECT_ROOT is set to cover this path (which it won't be in CI/test).
# check_name: hardcoded_cluster_paths

config_version: '1.0'

run:
  seed: 42
metadata:
  name: Failing — hardcoded_cluster_paths (index_path under /project/johnsson)

training:
  strategy_class: mriforge.infrastructure.training.strategies.reconstruction.ReconstructionTrainingStrategy
  epochs: 1
  device: cuda
  task: reconstruction
  output_dir: experiments/results/corpus_failing_hardcoded_cluster_paths

data:
  coil_processing_mode: rss
  dataset_type: kspace
  index_path: /project/johnsson/otheruser/mriforge/data/manifests/m4raw_train.json  # VIOLATION
  patch_size: [32, 32, 1]
  batch_size: 4
  num_workers: 0
  normalize_kspace: true
  validation_split: 0.1
  target_channels: 1
  samples_per_volume: 2
  datasets:
    - name: dummy
      path: databases/m4raw/data/multicoil_train
  caching:
    strategy: none

model:
  model_type: standard_unet
  in_channels: 2
  out_channels: 1
  model_kwargs:
    base_channels: 32
    channel_multipliers: [1, 2]
    num_res_blocks: 1
    dropout: 0.0

acceleration:
  base_acceleration: 4.0

optimization:
  learning_rate: 0.0001
  optimizer_type: adam
  weight_decay: 0.0
  use_amp: false
  enable_gradient_clipping: false

logging:
  log_interval: 5
  level: warning
  log_dir: experiments/results/corpus_failing_hardcoded_cluster_paths/logs

losses:
  output_domain: image
  image_losses:
    - name: mse
      weight: 1.0
      enabled: true
  kspace_losses: []
  complex_losses: []

physics:
  kspace:
    enforce_hermitian_symmetry: false
    enable_kspace_recon: false
  data_consistency:
    enabled: false
