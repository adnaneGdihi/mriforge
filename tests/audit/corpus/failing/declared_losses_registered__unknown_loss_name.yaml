# FAILING YAML — trips: declared_losses_registered (ConfigHealthChecker)
# Violation: losses.image_losses declares a loss name that is not registered
# in LossRegistry. The health checker fires declared_losses_registered with
# severity="error" for unregistered loss names in the enabled list.
# check_name: declared_losses_registered

config_version: '1.0'

run:
  seed: 42
metadata:
  name: Failing — declared_losses_registered (unknown loss name)

training:
  strategy_class: mriforge.infrastructure.training.strategies.reconstruction.ReconstructionTrainingStrategy
  epochs: 1
  device: cuda
  task: reconstruction
  output_dir: experiments/results/corpus_failing_declared_losses_registered

data:
  coil_processing_mode: rss
  dataset_type: synthetic
  patch_size: [32, 32, 1]
  batch_size: 4
  num_workers: 0
  normalize_images: true
  validation_split: 0.1
  target_channels: 1
  samples_per_volume: 2
  datasets:
    - name: dummy
      path: databases/m4raw/data/multicoil_train
  caching:
    strategy: none

model:
  model_type: standard_unet
  in_channels: 1
  out_channels: 1
  model_kwargs:
    base_channels: 32
    channel_multipliers: [1, 2]
    num_res_blocks: 1
    dropout: 0.0

optimization:
  learning_rate: 0.0001
  optimizer_type: adam
  weight_decay: 0.0
  use_amp: false
  enable_gradient_clipping: false

logging:
  log_interval: 5
  level: warning
  log_dir: experiments/results/corpus_failing_declared_losses_registered/logs

losses:
  output_domain: image
  image_losses:
    - name: totally_unregistered_loss_xyzzy_999  # VIOLATION: not in LossRegistry
      weight: 1.0
      enabled: true
  kspace_losses: []
  complex_losses: []

physics:
  kspace:
    enforce_hermitian_symmetry: false
    enable_kspace_recon: false
  data_consistency:
    enabled: false
