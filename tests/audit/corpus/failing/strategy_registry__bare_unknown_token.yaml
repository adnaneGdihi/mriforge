# FAILING YAML — trips: strategy_registry (ConfigHealthChecker)
# Violation: training.strategy_class is a bare token (not a registered alias
# and not a dotted import path). The health checker fires strategy_registry
# with severity="error" for this case.
# check_name: strategy_registry

config_version: '1.0'

run:
  seed: 42
metadata:
  name: Failing — strategy_registry (bare unknown token)

training:
  strategy_class: nonexistent_strategy_xyzzy_999
  # bare token — not a registered alias, not a dotted path → strategy_registry fires
  epochs: 1
  device: cuda
  task: reconstruction
  output_dir: experiments/results/corpus_failing_strategy_registry

data:
  coil_processing_mode: rss
  dataset_type: synthetic
  patch_size: [32, 32, 1]
  batch_size: 4
  num_workers: 0
  datasets:
    - name: dummy
      path: databases/m4raw/data/multicoil_train
  caching:
    strategy: none

model:
  model_type: standard_unet
  in_channels: 1
  out_channels: 1

optimization:
  learning_rate: 0.0001
  optimizer_type: adam

logging:
  log_interval: 5
  level: warning
  log_dir: experiments/results/corpus_failing_strategy_registry/logs

losses:
  output_domain: image
  image_losses:
    - name: mse
      weight: 1.0
      enabled: true
  kspace_losses: []
  complex_losses: []
